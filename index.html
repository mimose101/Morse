                  </div>
                  ${optionsHTML(ex)}
                </div>`;
                setTimeout(() => { if (session && currentEx() === ex) playGlyphAnim(2, 420); }, 700);
            } else if (ex.type === 'sound') {
                body.innerHTML = `<div class="qwrap">
                  <h2 class="prompt">听声音，这是哪个字母？<small>嘀是点，哒是划。</small></h2>
                  <div class="sound-box">
                    <button class="sound-btn" data-replay>${ICON.speaker}</button>
                    <div class="wave" id="wave">${'<i></i>'.repeat(7)}</div>
                    <div class="sound-hint">点按重听</div>
                  </div>
                  ${optionsHTML(ex)}
                </div>`;
                setTimeout(() => { if (session && currentEx() === ex) replaySound(); }, 420);
            } else if (ex.type === 'build') {
                body.innerHTML = `<div class="qwrap">
                  <h2 class="prompt">拼出这个字母的电码<small>按顺序点出 ${MORSE[ex.letter].length} 个符号。</small></h2>
                  <div class="build-stage">
                    <div class="build-letter">${ex.letter}</div>
                    <div class="slots" id="slots">${slotsHTML(ex)}</div>
                    <div class="keys">
                      <button class="key" data-key="."><span class="sym dot"></span><em>点</em></button>
                      <button class="key" data-key="-"><span class="sym dash"></span><em>划</em></button>
                      <button class="key del" data-del disabled>${ICON.back}</button>
                    </div>
                  </div>
                </div>`;
            } else if (ex.type === 'type') {
                body.innerHTML = `<div class="qwrap">
                  <h2 class="prompt">这个图形是哪个字母？<small>在下面的键盘上点出答案。</small></h2>
                  <div class="glyph-card shape-card">${glyphHTML(ex.letter)}</div>
                  <div class="letter-keys">
                    ${KEY_ROWS.map(row => `<div class="letter-row">${Array.from(row).map(l => `<button class="letter-key" data-letter="${l}">${l}</button>`).join('')}</div>`).join('')}
                  </div>
                </div>`;
                setTimeout(() => { if (session && currentEx() === ex) playGlyphAnim(2, 420); }, 460);
            }

            foot.innerHTML = `<div class="inner"><button class="btn primary big" id="mainBtn" onclick="lpMain()" disabled>检查</button></div>`;
        }

        function optionsHTML(ex) {
            return `<div class="options">
              ${ex.options.map(l => `<button class="opt" data-opt="${l}">
                <span class="ol">${l}</span>
              </button>`).join('')}
            </div>`;
        }

        function slotsHTML(ex) {
            const need = MORSE[ex.letter].length;
            const ans = session.answer || '';
            let h = '';
            for (let i = 0; i < need; i++) {
                const c = ans[i];
                let cls = 'slot';
                if (c) cls += ' filled';
                else if (i === ans.length) cls += ' next';
                h += `<div class="${cls}">${c ? `<span class="sym ${c === '.' ? 'dot' : 'dash'}"></span>` : ''}</div>`;
            }
            return h;
        }

        // 拼码界面：槽位 / 退格键 / 检查按钮三者状态一起刷新
        function updateBuildUI(ex) {
            const slots = $('#slots');
            if (slots) slots.innerHTML = slotsHTML(ex);
            const del = $('[data-del]');
            if (del) del.disabled = !(session.answer || '');
            const b = $('#mainBtn');
            if (b) b.disabled = (session.answer || '').length < MORSE[ex.letter].length;
        }

        function updateBar() {
            const bar = $('#lessonBar');
            if (!bar || !session) return;
            const pct = Math.round((session.i / Math.max(1, session.queue.length)) * 100);
            bar.style.width = pct + '%';
        }

        function updateHearts() {
            const el = $('#lessonHearts');
            if (!el || !session) return;
            if (session.drill) {
                el.innerHTML = `<span style="font-size:14px;font-weight:900;color:var(--green)">✓ ${session.correct}</span>`;
                return;
            }
            let h = '';
            for (let i = 0; i < 5; i++) {
                const on = i < session.hearts;
                h += `<svg viewBox="0 0 24 24"><path d="M12 20.5S4 15.8 4 10.6A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8 3.6c0 5.2-8 9.9-8 9.9Z" fill="${on ? '#FF4B4B' : '#E5E5E5'}"/></svg>`;
            }
            el.innerHTML = h;
        }

        function selectOption(l) {
            if (!session || session.phase !== 'answer') return;
            session.answer = l;
            Sound.tap();
            $$('.opt').forEach(o => o.classList.toggle('sel', o.dataset.opt === l));
            const b = $('#mainBtn');
            if (b) b.disabled = false;
        }

        function pickLetter(l) {
            if (!session || session.phase !== 'answer') return;
            session.answer = l;
            Sound.tap();
            $$('.letter-key').forEach(k => k.classList.toggle('sel', k.dataset.letter === l));
            const b = $('#mainBtn');
            if (b) b.disabled = false;
        }

        function tapKey(k) {
            if (!session || session.phase !== 'answer') return;
            const ex = currentEx();
            if (!ex) return;
            const need = MORSE[ex.letter].length;
            if ((session.answer || '').length >= need) return;
            session.answer = (session.answer || '') + k;
            Sound.morse(k);
            updateBuildUI(ex);
        }

        function delKey() {
            if (!session || session.phase !== 'answer') return;
            const ex = currentEx();
            session.answer = (session.answer || '').slice(0, -1);
            updateBuildUI(ex);
            Sound.tap();
        }

        function onLessonClick(e) {
            const opt = e.target.closest('[data-opt]');
            if (opt) { selectOption(opt.dataset.opt); return; }
            const lk = e.target.closest('[data-letter]');
            if (lk) { pickLetter(lk.dataset.letter); return; }
            const key = e.target.closest('[data-key]');
            if (key) { tapKey(key.dataset.key); return; }
            if (e.target.closest('[data-del]')) { delKey(); return; }
            if (e.target.closest('[data-replay]')) { replaySound(); return; }
            if (e.target.closest('[data-playglyph]')) { playGlyphAnim(); return; }
        }

        function onLessonInput(e) {
            if (e.target.id !== 'typeInput') return;
            let v = e.target.value.replace(/[^a-zA-Z]/g, '').toUpperCase();
            e.target.value = v;
            session.answer = v;
            const b = $('#mainBtn');
            if (b) b.disabled = !v;
        }

        function replaySound() {
            const ex = currentEx();
            if (!ex) return;
            const wave = $('#wave');
            if (wave) {
                wave.classList.add('on');
                setTimeout(() => wave.classList.remove('on'), Math.max(700, MORSE[ex.letter].length * 360));
            }
            Sound.morse(MORSE[ex.letter]);
        }

        // times：循环播放几遍（新字母卡默认 3 遍）
        function playGlyphAnim(times, hold) {
            const ex = currentEx();
            if (!ex) return;
            // 图形题点亮字形，读码题点亮电码框
            let parts = Array.from(document.querySelectorAll('#lessonBody .glyph .part'));
            if (!parts.length) parts = Array.from(document.querySelectorAll('#lessonBody .code-box .sym'));
            if (!parts.length) return;
            const code = MORSE[ex.letter];
            const litFor = hold || 240;
            const gap = Sound.morseLength(code) + 620;
            const rounds = times || 1;
            let round = 0;

            clearTimeout(glyphTimer);
            const run = () => {
                if (!session || currentEx() !== ex) return;
                parts.forEach(p => p.classList.remove('lit'));
                let prev = null;
                Sound.morse(code, (i) => {
                    const p = parts[i];
                    if (prev) prev.classList.remove('lit');   // 只在当前这个符号上亮，形成走位
                    if (!p) return;
                    prev = p;
                    p.classList.add('lit');
                    setTimeout(() => p.classList.remove('lit'), litFor);
                });
                round++;
                if (round < rounds) glyphTimer = setTimeout(run, gap + litFor);
            };
            run();
        }

        function lpMain() {
            if (!session) return;
            const ex = currentEx();
            if (!ex) return;
            if (ex.type === 'learn') { lpNext(); return; }
            if (!session.answer) return;
            checkAnswer();
        }

        function checkAnswer() {
            clearTimeout(glyphTimer);
            glyphTimer = null;
            const ex = currentEx();
            let ok = false;
            if (ex.type === 'build') ok = (session.answer || '') === MORSE[ex.letter];
            else if (ex.type === 'type') ok = (session.answer || '').toUpperCase() === ex.letter;
            else ok = session.answer === ex.letter;

            session.phase = 'feedback';

            $$('.opt').forEach(o => {
                if (o.dataset.opt === ex.letter) o.classList.add('ok');
                else if (o.classList.contains('sel')) o.classList.add('bad');
            });

            if (ex.type === 'build') {
                $$('.slot').forEach((s, i) => {
                    const c = (session.answer || '')[i];
                    s.classList.add(ok ? 'ok' : 'bad');
                });
            }

            if (ok) {
                session.correct++;
                if (S.miss[ex.letter]) S.miss[ex.letter] = Math.max(0, S.miss[ex.letter] - 0.34);
                Sound.correct();
            } else {
                session.wrong++;
                S.miss[ex.letter] = (S.miss[ex.letter] || 0) + 1;
                saveState();
                Sound.wrong();
                if (!session.drill) session.hearts--;
                if (!ex.repeated && session.queue.length < 42) {
                    session.queue.push(Object.assign({}, ex, { repeated: true }));
                }
            }

            updateHearts();
            renderFeedback(ok);
        }

        function renderFeedback(ok) {
            const ex = currentEx();
            const foot = $('#lessonFoot');

            if (ok) {
                // 答对：底部的绿色轻提示
                foot.className = 'lesson-foot ok';
                foot.innerHTML = `<div class="inner">
                  <div class="fb">
                    <div class="fb-icon">✓</div>
                    <div style="min-width:0">
                      <div class="fb-title">${pick(['漂亮！', '答对了！', '就是这个！', '稳稳的！'])}</div>
                      <div class="fb-sub">${ex.letter} = ${pretty(MORSE[ex.letter])}</div>
                    </div>
                  </div>
                  <button class="btn green big" id="mainBtn" onclick="lpNext()">继续</button>
                </div>`;
                return;
            }

            // 答错：底部只留按钮，答案卡片落在选项下方
            foot.className = 'lesson-foot';
            foot.innerHTML = `<div class="inner"><button class="btn red big" id="mainBtn" onclick="lpNext()">继续</button></div>`;

            const wrap = $('#lessonBody .qwrap');
            if (wrap) {
                wrap.insertAdjacentHTML('beforeend', `<div class="q-feedback">
                    <div class="qf-glyph">${glyphHTML(ex.letter, { watermark: true })}</div>
                    <div class="qf-info">
                      <div class="qf-title"><i>✕</i>再记一遍</div>
                      <div class="qf-answer">
                        <span class="qf-letter">${ex.letter}</span>
                        <span class="qf-morse">${morseSymbols(ex.letter)}</span>
                      </div>
                    </div>
                    <button class="qf-play" onclick="lpPlayFeedback('${ex.letter}', this)" aria-label="重听 ${ex.letter} 的电码">${ICON.speaker}</button>
                  </div>`);
            }

            const body = $('#lessonBody');
            if (body) setTimeout(() => body.scrollTo({ top: body.scrollHeight, behavior: 'smooth' }), 80);

            clearTimeout(fbTimer);
            fbTimer = setTimeout(() => {
                if (session && session.phase === 'feedback') lpPlayFeedback(ex.letter, $('.q-feedback'), 3);
            }, 430);
        }

        // 播放正确答案：声音 + 字形逐笔点亮；times 控制循环遍数（自动播放 3 遍）
        function lpPlayFeedback(letter, el, times) {
            clearTimeout(fbTimer);
            fbTimer = null;
            const scope = (el && el.closest) ? (el.closest('.q-feedback') || el) : $('.q-feedback');
            const parts = scope ? Array.from(scope.querySelectorAll('.part')) : [];
            const code = MORSE[letter];
            const litFor = 300;
            const gap = Sound.morseLength(code) + 520;
            const rounds = times || 1;
            let round = 0;

            const run = () => {
                if (!session || session.phase !== 'feedback') return;
                parts.forEach(p => p.classList.remove('lit'));
                let prev = null;
                Sound.morse(code, (i) => {
                    if (prev) prev.classList.remove('lit');
                    const p = parts[i];
                    if (!p) return;
                    prev = p;
                    p.classList.add('lit');
                    setTimeout(() => p.classList.remove('lit'), litFor);
                });
                round++;
                if (round < rounds) fbTimer = setTimeout(run, gap + litFor);
            };
            run();
        }

        function lpNext() {
            if (!session) return;
            clearTimeout(fbTimer);
            fbTimer = null;
            session.i++;
            if (!session.drill && session.hearts <= 0) { showFail(); return; }
            if (session.i >= session.queue.length) { finishSession(); return; }
            renderExercise();
        }

        function finishSession() {
            const total = session.correct + session.wrong;
            const acc = total ? Math.round((session.correct / total) * 100) : 100;
            let xp;
            if (session.mode === 'drill') {
                xp = Math.max(1, Math.round(session.correct * 0.8));
            } else {
                // 课越长，XP 越多，但增长略低于题量
                xp = Math.round(7 + total * 0.9) + (acc >= 90 ? 3 : 0) + (session.lesson.review ? 1 : 0);
            }

            S.xp += xp;
            S.todayXp += xp;

            if (session.mode === 'lesson') {
                S.done[session.lesson.id] = { date: todayKey(), acc: acc };
                const t = todayKey();
                if (S.lastDay !== t) {
                    S.streak = (S.lastDay === dayKey(-1)) ? S.streak + 1 : 1;
                    S.lastDay = t;
                }
            }
            saveState();
            updateTop();

            const secs = Math.max(1, Math.round((Date.now() - session.start) / 1000));
            const isDrill = session.mode === 'drill';
            const title = isDrill ? '练习完成！' : '课程完成！';
            const sub = isDrill
                ? `答对 ${session.correct} / ${total} 题，手感正热。`
                : (acc === 100 ? '全对！这一课的点划已经刻进脑子里了。' : '又点亮了几个字母，继续保持。');

            $('#lesson').innerHTML = `<div class="done-screen">
              ${mascot(152, acc >= 60 ? 'happy' : 'sad')}
              <div class="done-h">${title}</div>
              <div class="done-p">${sub}</div>
              <div class="done-stats">
                <div class="ds gold"><span>XP</span><b>+${xp}</b></div>
                <div class="ds green"><span>正确率</span><b>${acc}%</b></div>
                <div class="ds blue"><span>用时</span><b>${fmtTime(secs)}</b></div>
              </div>
              <div class="done-actions">
                <button class="btn primary big" onclick="lpExit()">继续</button>
                <button class="btn ghost big" onclick="lpAgain()">再来一次</button>
              </div>
            </div>`;
            confetti();
        }

        function showFail() {
            $('#lesson').innerHTML = `<div class="done-screen">
              ${mascot(152, 'sad')}
              <div class="done-h">爱心用完了</div>
              <div class="done-p">别急，这一课的字母已经认识了，再来一次就好。</div>
              <div class="done-actions">
                <button class="btn primary big" onclick="lpAgain()">重新开始本课</button>
                <button class="btn ghost big" onclick="lpExit()">返回学习路径</button>
              </div>
            </div>`;
        }

        function lpAgain() {
            if (!session) return;
            if (session.mode === 'drill') startDrill(session.kind);
            else lpStartLesson(session.lesson.id);
        }

        function lpExit() {
            clearTimeout(fbTimer);
            clearTimeout(glyphTimer);
            fbTimer = null;
            glyphTimer = null;
            const el = $('#lesson');
            el.classList.add('hidden');
            el.innerHTML = '';
            session = null;
            go(currentView);
        }

        function lpExitConfirm() {
            openModal(`
              <div class="sheet-head">
                <div class="sheet-title">退出本课？</div>
                <button class="sheet-close" onclick="lpCloseModal()">${ICON.x}</button>
              </div>
              <div class="confirm-txt">这一课的进度不会保存，已答对的题目也会作废。</div>
              <div class="confirm-actions">
                <button class="btn ghost" onclick="lpCloseModal()">继续上课</button>
                <button class="btn red" onclick="lpCloseModal();lpExit()">退出</button>
              </div>`);
        }

        function confetti() {
            const colors = ['#58CC02', '#1CB0F6', '#FFC800', '#FF9600', '#CE82FF', '#FF4B4B'];
            const wrap = document.createElement('div');
            wrap.className = 'confetti';
            for (let i = 0; i < 30; i++) {
                const s = document.createElement('i');
                s.style.left = (Math.random() * 100) + '%';
                s.style.background = pick(colors);
                s.style.animationDelay = (Math.random() * 0.7) + 's';
                s.style.animationDuration = (1.5 + Math.random() * 1.3) + 's';
                s.style.opacity = 0.9;
                wrap.appendChild(s);
            }
            $('#lesson').appendChild(wrap);
            setTimeout(() => wrap.remove(), 3600);
        }

        /* ============================================================
           13. 事件绑定
           ============================================================ */
        function bindGlobal() {
            document.addEventListener('click', e => {
                const nav = e.target.closest('[data-view]');
                if (nav) { go(nav.dataset.view); return; }
            });

            const practice = $('#viewPractice');
            practice.addEventListener('click', e => {
                const d = e.target.closest('[data-drill]');
                if (d) { startDrill(d.dataset.drill); return; }
                const tm = e.target.closest('[data-tmode]');
                if (tm) {
                    transMode = tm.dataset.tmode;
                    renderPractice();
                    return;
                }
                if (e.target.closest('[data-tplay]')) {
                    if (!transText.trim()) return;
                    if (transMode === 'enc') playCodeString(textToMorse(transText));
                    else playCodeString(transText);
                    return;
                }
                if (e.target.closest('[data-tcopy]')) {
                    const txt = transOutText || ($('#transOut') ? $('#transOut').textContent : '');
                    if (txt && navigator.clipboard) {
                        navigator.clipboard.writeText(txt);
                        const btn = e.target.closest('[data-tcopy]');
                        const old = btn.textContent;
                        btn.textContent = '已复制';
                        setTimeout(() => { btn.textContent = old; }, 1400);
                    }
                }
            });
            practice.addEventListener('input', e => {
                if (e.target.id === 'transIn') {
                    transText = e.target.value;
                    updateTransOut();
                }
            });

            const me = $('#viewMe');
            me.addEventListener('click', e => {
                if (e.target.closest('#unlockSwitch')) {
                    S.unlockAll = !S.unlockAll;
                    saveState();
                    renderMe();
                    return;
                }
                if (e.target.closest('#soundSwitch')) {
                    S.muted = !S.muted;
                    saveState();
                    updateTop();
                    renderMe();
                    return;
                }
                if (e.target.closest('#vibeSwitch')) {
                    if (!Feedback.canVibrate) return;
                    S.vibrate = !S.vibrate;
                    saveState();
                    if (S.vibrate) Feedback.testVibrate();
                    renderMe();
                    return;
                }
                if (e.target.closest('#torchSwitch')) {
                    if (!Feedback.canTorch) return;
                    if (S.torch) {
                        S.torch = false;
                        Feedback.lastError = '';
                        Feedback.disableTorch();
                        saveState();
                        renderMe();
                    } else {
                        Feedback.lastError = '';
                        Feedback.enableTorch().then(res => {
                            S.torch = !!res.ok;
                            if (!res.ok) Feedback.lastError = res.reason;
                            saveState();
                            renderMe();
                            if (res.ok) Feedback.flash(260);
                        });
                    }
                    return;
                }
            });

            $('#muteBtn').addEventListener('click', () => {
                S.muted = !S.muted;
                saveState();
                updateTop();
                if (!S.muted) Sound.pop();
            });

            /* 切到后台/离开页面时立刻关灯并释放相机，别把别人的手电筒留在开着 */
            const releaseTorch = () => {
                if (!Feedback.torchReady && !Feedback.torchStream) return;
                Feedback.disableTorch();
                if (S.torch) { S.torch = false; saveState(); }
            };
            window.addEventListener('pagehide', releaseTorch);
            window.addEventListener('beforeunload', releaseTorch);
            document.addEventListener('visibilitychange', () => { if (document.hidden) releaseTorch(); });

            $('#modal').addEventListener('click', e => {
                if (e.target.id === 'modal') closeModal();
            });

            document.addEventListener('keydown', e => {
                if (e.key === 'Escape') {
                    if (!$('#modal').classList.contains('hidden')) { closeModal(); return; }
                    if (session) { if ((session.correct + session.wrong) > 0) lpExitConfirm(); else lpExit(); }
                    return;
                }
                if (!session) return;
                const tag = (e.target.tagName || '').toLowerCase();
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (session.phase === 'feedback') lpNext();
                    else lpMain();
                    return;
                }
                if (session.phase === 'answer' && tag !== 'input') {
                    const exs = currentEx();
                    if (exs && exs.type === 'type' && /^[a-zA-Z]$/.test(e.key)) {
                        pickLetter(e.key.toUpperCase());
                        return;
                    }
                    const n = parseInt(e.key, 10);
                    if (n >= 1 && n <= 4) {
                        const opts = $$('.opt');
                        if (opts[n - 1]) selectOption(opts[n - 1].dataset.opt);
                    }
                }
            });

            document.addEventListener('pointerdown', () => Sound.ensure(), { once: true });
        }

        /* ============================================================
           14. 启动
           ============================================================ */
        function init() {
            UNITS.forEach((u, ui) => {
                u.lessons.forEach((l, li) => {
                    l.id = u.id + '-' + (li + 1);
                    l.unit = u;
                    l.level = u.level;
                    l.index = li;
                });
            });
            ALL = UNITS.reduce((acc, u) => acc.concat(u.lessons), []);
            bindGlobal();
            updateTop();
            go('home');
        }

        init();
    </script>
</body>
